<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Tasks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .task-enter { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-8 px-4 sm:px-6 flex flex-col justify-between">

  <div class="max-w-lg w-full mx-auto">
    <!-- Header & Progress -->
    <header class="mb-6">
      <div class="flex items-center justify-between mb-2">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-white">Daily Focus</h1>
          <p id="current-date" class="text-xs text-slate-400 mt-0.5"></p>
        </div>
        <div class="text-right">
          <span id="progress-text" class="text-sm font-semibold text-indigo-400">0 / 0 done</span>
        </div>
      </div>
      <!-- Progress Bar -->
      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-indigo-500 h-full transition-all duration-300 w-0"></div>
      </div>
    </header>

    <!-- Add Task Form -->
    <form id="todo-form" class="mb-6 flex gap-2">
      <input 
        type="text" 
        id="todo-input" 
        placeholder="Add a daily task..." 
        required
        autocomplete="off"
        class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
      >
      <button 
        type="submit" 
        class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium px-5 py-3 rounded-xl text-sm transition shadow-sm"
      >
        Add
      </button>
    </form>

    <!-- Filter Tabs -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4 text-xs font-medium text-slate-400">
      <div class="flex gap-2">
        <button data-filter="all" class="filter-btn px-3 py-1.5 rounded-lg bg-slate-800 text-white transition">All</button>
        <button data-filter="active" class="filter-btn px-3 py-1.5 rounded-lg hover:text-slate-200 transition">Pending</button>
        <button data-filter="completed" class="filter-btn px-3 py-1.5 rounded-lg hover:text-slate-200 transition">Completed</button>
      </div>
      <button id="clear-completed" class="hover:text-rose-400 transition hidden">Clear Done</button>
    </div>

    <!-- Task List -->
    <ul id="todo-list" class="space-y-2.5"></ul>

    <!-- Empty State -->
    <div id="empty-state" class="text-center py-12 hidden">
      <p class="text-slate-500 text-sm">Nothing on the list right now. Add a task above!</p>
    </div>
  </div>

  <!-- Footer: Backup & Restore Controls -->
  <footer class="max-w-lg w-full mx-auto mt-12 pt-4 border-t border-slate-900 flex items-center justify-between text-xs text-slate-400">
    <span>Data saved locally in browser</span>
    <div class="flex items-center gap-2">
      <button 
        id="export-btn" 
        type="button"
        class="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 px-3 py-1.5 rounded-lg transition"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        Export JSON
      </button>

      <label 
        for="import-input" 
        class="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 px-3 py-1.5 rounded-lg cursor-pointer transition"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
        Import JSON
      </label>
      <input type="file" id="import-input" accept=".json,application/json" class="hidden">
    </div>
  </footer>

  <!-- Status Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 border border-slate-700 text-slate-100 text-xs font-medium px-4 py-2.5 rounded-xl shadow-lg opacity-0 pointer-events-none transition-opacity duration-200"></div>

  <script>
    const STORAGE_KEY = 'daily_focus_todos_v1';
    let todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentFilter = 'all';

    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');
    const progressText = document.getElementById('progress-text');
    const progressBar = document.getElementById('progress-bar');
    const clearCompletedBtn = document.getElementById('clear-completed');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const exportBtn = document.getElementById('export-btn');
    const importInput = document.getElementById('import-input');
    const toast = document.getElementById('toast');

    // Display formatted current date
    document.getElementById('current-date').textContent = new Intl.DateTimeFormat('en-US', {
      weekday: 'long', month: 'short', day: 'numeric'
    }).format(new Date());

    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 2500);
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      render();
    }

    function addTodo(text) {
      todos.unshift({
        id: Date.now().toString(),
        text: text.trim(),
        completed: false,
        createdAt: new Date().toISOString()
      });
      save();
    }

    function toggleTodo(id) {
      todos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      save();
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      save();
    }

    function clearCompleted() {
      todos = todos.filter(t => !t.completed);
      save();
    }

    // Export tasks to a downloadable JSON file
    exportBtn.addEventListener('click', () => {
      if (todos.length === 0) {
        showToast('No tasks to export yet!');
        return;
      }
      const dateStr = new Date().toISOString().split('T')[0];
      const dataStr = JSON.stringify(todos, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `daily-tasks-backup-${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Backup exported!');
    });

    // Import tasks from a JSON file (merges by ID so nothing is lost)
    importInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (!Array.isArray(imported)) throw new Error('Invalid format');

          const validTasks = imported.filter(item => item && typeof item.text === 'string');
          const existingIds = new Set(todos.map(t => t.id));

          let addedCount = 0;
          validTasks.forEach(task => {
            const normalizedTask = {
              id: task.id ? String(task.id) : (Date.now() + Math.random()).toString(),
              text: task.text.trim(),
              completed: Boolean(task.completed),
              createdAt: task.createdAt || new Date().toISOString()
            };
            if (!existingIds.has(normalizedTask.id)) {
              todos.push(normalizedTask);
              existingIds.add(normalizedTask.id);
              addedCount++;
            }
          });

          save();
          showToast(`Imported ${addedCount} task(s) successfully!`);
        } catch (err) {
          showToast('Invalid JSON backup file.');
        } finally {
          importInput.value = ''; // Reset file input so same file can be re-selected if needed
        }
      };
      reader.readAsText(file);
    });

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }

    function render() {
      const filtered = todos.filter(t => {
        if (currentFilter === 'active') return !t.completed;
        if (currentFilter === 'completed') return t.completed;
        return true;
      });

      const total = todos.length;
      const doneCount = todos.filter(t => t.completed).length;
      const percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);

      progressText.textContent = `${doneCount} / ${total} done`;
      progressBar.style.width = `${percent}%`;
      clearCompletedBtn.classList.toggle('hidden', doneCount === 0);

      list.innerHTML = '';
      
      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        filtered.forEach(todo => {
          const li = document.createElement('li');
          li.className = `task-enter flex items-center justify-between gap-3 bg-slate-900/90 border border-slate-800/80 rounded-xl px-4 py-3.5 transition hover:border-slate-700 ${todo.completed ? 'opacity-60' : ''}`;
          
          li.innerHTML = `
            <label class="flex items-center gap-3.5 flex-1 cursor-pointer select-none">
              <input 
                type="checkbox" 
                ${todo.completed ? 'checked' : ''} 
                class="w-5 h-5 rounded-md accent-indigo-500 cursor-pointer"
                onchange="toggleTodo('${todo.id}')"
              >
              <span class="text-sm ${todo.completed ? 'line-through text-slate-500' : 'text-slate-100'} break-all">
                ${escapeHTML(todo.text)}
              </span>
            </label>
            <button 
              onclick="deleteTodo('${todo.id}')" 
              aria-label="Delete task"
              class="text-slate-500 hover:text-rose-400 p-1 rounded-lg transition"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          `;
          list.appendChild(li);
        });
      }
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      if (input.value.trim()) {
        addTodo(input.value);
        input.value = '';
      }
    });

    clearCompletedBtn.addEventListener('click', clearCompleted);

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        filterBtns.forEach(b => {
          b.classList.remove('bg-slate-800', 'text-white');
        });
        btn.classList.add('bg-slate-800', 'text-white');
        render();
      });
    });

    render();
  </script>
</body>
</html>
